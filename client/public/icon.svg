<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="200" r="120" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-dasharray="24 16" opacity="0.6" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Stylized Lightning / Fitness Flame Glyph -->
  <path d="M280 90 L180 270 L250 270 L230 422 L332 242 L262 242 Z" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <path d="M280 90 L180 270 L250 270 L230 422 L332 242 L262 242 Z" fill="#ffffff" opacity="0.25" />
</svg>
